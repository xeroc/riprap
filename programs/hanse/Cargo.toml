[package]
name = "hanse"
version.workspace = true
description = "Hanse event mutual orchestrator — bounded-lifetime mutual on top of the pool primitive"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hanse"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "accord/idl-build",
]
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
# anchor-lang resolves to 1.2.0 workspace-wide (matches the declared house
# version and anchor-cli 1.2.0). The old pin (ba91bd8) forced a 1.1.2
# unification via `anchor_lang::__private`; the 25c48b28 pin declares 1.2.0
# and the lock unifies cleanly.
# Cross-repo pin: rev bumps are deliberate — each is a protocol decision, never
# a floating branch. Local override for sibling-checkout workflows goes in
# .cargo/config [patch] (e.g. patch accord to a path dependency).
# Cargo.lock note: five8 1.0.0 must stay wired to five8_core 1.0.0 (not 0.1.2,
# which ephemeral-rollups-sdk's five8 0.2.1 also pulls in) or solana-keypair
# 3.1.x fails E0277. The lock pins that edge; a blind `cargo update` can regress it.
pool = { path = "../pool", features = ["cpi"] }
solana-program = "3"
accord = { git = "https://github.com/xeroc/accord.git", rev = "25c48b281425f68afe86366ce1a932631695c413", features = [
    "cpi",
] }

[dev-dependencies]
litesvm = "0.10.0"
spl-associated-token-account-interface = "2.0.0"
borsh = "1.8"
spl-token-interface = "3.0.0"
solana-message = "3.0.1"
solana-account = "3"
solana-clock = "3.0"
solana-program-pack = "3.1.0"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
hanse = { path = ".", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
