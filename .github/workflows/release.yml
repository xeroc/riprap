name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: nothing is granted unless a job declares it.
permissions: {}

env:
  NODE_VERSION: "22"

jobs:
  landingpage:
    name: Update Landing Page
    secrets: inherit
    permissions:
      contents: write # gh-pages push (deploy step is gated to main inside the called workflow)
    uses: ./.github/workflows/landing-page.yaml

  program-tests:
    name: Program Tests
    permissions:
      contents: read
    uses: ./.github/workflows/program-tests.yml

  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  changeset-status:
    name: Changeset present
    # The auto-generated version PR (changeset-release/*) never carries changesets — skip it.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # status diffs packages against the merge base

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when packages changed since main but no changeset was added.
      # `origin/main`, not `main`: PR checkouts have no local main branch for
      # merge-base to resolve. Escape hatch for CI-only changes: `pnpm changeset --empty`.
      - name: Check for changeset
        run: pnpm changeset status --since origin/main

  release:
    name: Version packages
    needs: [tests, program-tests]
    # Versioning runs on main only (push, or manual dispatch to retry) and never
    # before the test pipeline is green. Nothing is published — every package is
    # private; changesets exist to version the workspace lockstep and stamp the
    # IDL versions.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes + push tags
      pull-requests: write # version PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # v2 renamed its inputs (v1: version/publish/commit/title) — the old
      # names silently no-op here and would fall back to plain `changeset version`.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm run release:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # changelog-github inside release:version

      # hasChangesets == 'false' on main means the version PR just merged (or a
      # changeset-exempt push); tagging is idempotent, so plain pushes re-run it
      # as a no-op.
      - name: Tag umbrella version
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          V=$(node -p 'require("./packages/pool/package.json").version')
          git tag "v$V" 2>/dev/null || true
          git push origin "v$V" 2>/dev/null || true
