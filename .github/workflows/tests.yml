name: Tests

on:
  workflow_call:

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm -r run build

      - name: Run linter
        run: pnpm lint

      # The jest e2e (@riprap/tests) and the CLI smoke probe their RPC and skip
      # cleanly when no validator answers — this lane has none.
      - name: Run tests
        run: pnpm -r run test
