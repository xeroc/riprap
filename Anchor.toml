[features]
resolution = true
skip-lint = false

[programs.devnet]
hanse = "rip6LwufCPcuDsCp2G184dBLGwpTTNcv3F2aKUbfpk6"
pool = "PuuLXN4dNzoZ363h93WZi76NHwbH2AZcafKUqjGgdkf"

[programs.localnet]
hanse = "rip6LwufCPcuDsCp2G184dBLGwpTTNcv3F2aKUbfpk6"
pool = "PuuLXN4dNzoZ363h93WZi76NHwbH2AZcafKUqjGgdkf"

[programs.mainnet]
hanse = "rip6LwufCPcuDsCp2G184dBLGwpTTNcv3F2aKUbfpk6"
pool = "PuuLXN4dNzoZ363h93WZi76NHwbH2AZcafKUqjGgdkf"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm --filter @riprap/tests test"

[hooks]
# Stage the checked-in external binaries (SAS) into target/deploy AFTER any
# cache restore: the CI program-tests job restores a rust-cache of target/
# inside the run-tests action, and a partial (restore-key) cache hit
# pre-cleans target/ — wiping anything staged before the action ran. This
# hook runs at the last safe point (after builds/cache, before Surfpool
# starts and evaluates the deployment runbook's deploy_sas action).
pre-test = "bash tests/deps/stage.sh"
